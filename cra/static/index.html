<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognitive Research Agent</title>
<style>
:root{
  --bg:#faf8f5;--bg-alt:#fff;--card:#ffffff;--tx:#201a14;--mu:#766c60;--bd:#ece3d6;
  --ac:#ff6a1a;--ac-dark:#e35300;--ac-light:#fff1e4;--ok:#1b7f4b;--bad:#c23616;--wa:#9a6700;
  --shadow-sm:0 1px 3px rgba(32,20,10,.06);--shadow-md:0 10px 28px -10px rgba(32,20,10,.16);--shadow-lg:0 26px 60px -22px rgba(32,20,10,.32);
  --r-sm:8px;--r-md:12px;--r-lg:18px}
@media(prefers-color-scheme:dark){:root{--bg:#15120f;--bg-alt:#1c1814;--card:#211c17;--tx:#f3ece3;--mu:#ab9f8f;--bd:#372f26;--ac:#ff8a3d;--ac-dark:#ff6a1a;--ac-light:#2c2119;--ok:#5fd394;--bad:#ff8a80;--wa:#e0b040}}
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}body{margin:0;font:15px/1.55 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:0 22px;height:58px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--ac),var(--ac-dark));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px -4px rgba(255,106,26,.55)}
header b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
#who{display:flex;align-items:center;gap:14px}
nav{display:flex;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:3px}
nav button{border:none;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--mu)}
nav button.on{background:var(--card);color:var(--ac-dark);box-shadow:var(--shadow-sm);font-weight:600}
.userchip{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
h2{font-size:16px;margin:0 0 10px;font-weight:700}h3{font-size:14px;margin:12px 0 6px;font-weight:600}
button{font:inherit;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
button:hover{border-color:var(--ac)}button:active{transform:translateY(1px)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;box-shadow:0 6px 16px -6px rgba(255,106,26,.5)}
button.p:hover{background:var(--ac-dark);border-color:var(--ac-dark)}
button:disabled{opacity:.5;cursor:default;transform:none}
input,textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--bg-alt);color:var(--tx);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-light)}
textarea{min-height:64px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row>*{width:auto}.row>.f{flex:1;min-width:120px}
.mu{color:var(--mu);font-size:13px}.tag{font-size:11.5px;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;color:var(--mu);font-weight:600;white-space:nowrap}
.ev{border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px;margin-bottom:8px}.ev p{margin:6px 0;white-space:pre-wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.chat{max-height:260px;overflow:auto;margin-bottom:8px}.q{font-weight:600;margin-top:8px}.a{white-space:pre-wrap;color:var(--mu)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:9px 16px;border-radius:8px;max-width:90%;box-shadow:var(--shadow-lg)}
.score{font-size:30px;font-weight:700}ul{margin:4px 0;padding-left:20px}.narrow{max-width:420px;margin:30px auto}

/* ---- Dashboard / Cases (Step 2: premium white+orange redesign) ---- */
.welcome{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;margin-bottom:22px}
.welcome h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.stat-row{display:flex;gap:12px;flex-wrap:wrap}
.stat-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px 20px;min-width:108px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-num{font-size:22px;font-weight:700;color:var(--ac-dark)}
.stat-label{font-size:11.5px;color:var(--mu);margin-top:2px}
.dash-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search-wrap{position:relative;flex:1;min-width:220px;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:11px;opacity:.5;pointer-events:none}
.search-wrap input{padding-left:36px}
.dash-toolbar select{width:auto;min-width:150px}
.section-title{margin-top:26px}
.case-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s,border-color .18s;display:flex;flex-direction:column;gap:6px}
.case-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--ac-light)}
.case-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.case-card h3{font-size:15.5px;margin:2px 0 0}
.case-domain{text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:600;color:var(--ac-dark)}
.case-overview{font-size:13.5px;color:var(--mu);margin:4px 0 2px;flex:1}
.case-meta{font-size:12px}
.case-cta{width:100%;justify-content:center;margin-top:8px}
.diff-easy{background:#eaf7ee;color:#1b7f4b;border-color:#cdeeda}
.diff-medium{background:var(--ac-light);color:var(--ac-dark);border-color:#ffe0c2}
.diff-hard{background:#fdeceb;color:#c23616;border-color:#f8d2cd}
.tag-done{background:#eaf7ee;color:#1b7f4b;border-color:#cdeeda}
.tag-progress{background:var(--ac-light);color:var(--ac-dark);border-color:#ffe0c2}
.activity-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.activity-row:last-child{border-bottom:none}
.activity-main{flex:1;min-width:180px}
.empty-state{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:var(--r-lg)}
.skel{background:linear-gradient(90deg,var(--bd) 25%,var(--bg) 37%,var(--bd) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:var(--r-lg);height:180px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:720px){header{padding:0 14px}main{padding:16px 12px 48px}.welcome{align-items:flex-start}.stat-row{width:100%}.stat-card{flex:1}.dash-toolbar select{flex:1;min-width:0}}
@media(max-width:480px){.dash-toolbar .search-wrap{min-width:100%}.dash-toolbar select{min-width:0;flex:1}}
@media(max-width:600px){
  header{height:auto;flex-wrap:wrap;row-gap:8px;padding:10px 14px}
  #who{flex-wrap:wrap;gap:8px;width:100%;justify-content:flex-start}
  nav{order:2}
  .userchip{flex-wrap:wrap;gap:6px;width:100%;justify-content:space-between}
  .userchip span{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-identity{flex-wrap:wrap;row-gap:2px}
  .chat-identity .mu{width:100%;margin-left:16px}
  .score-ring{margin:0 auto}
  .report-top{text-align:center}
  .report-meta{align-items:center}
}

/* ---- Investigation workspace (Step 3: premium redesign + knowledge graph) ---- */
.ws-header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ws-header-actions{display:flex;gap:8px}
.ws-title{font-size:21px;margin:4px 0 6px;letter-spacing:-.01em}
.ws-overview{color:var(--mu);font-size:13.5px;margin:0 0 10px;max-width:760px}
.ws-objective{background:var(--ac-light);border:1px solid #ffe0c2;border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:8px}
.ws-objective b{color:var(--ac-dark);flex:none}
@media(prefers-color-scheme:dark){.ws-objective{border-color:#4a2e16}}
.ws-progress-bar{height:7px;border-radius:5px;background:var(--bd);overflow:hidden;margin-bottom:6px}
.ws-progress-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac-dark));border-radius:5px;transition:width .4s ease}
.ws-tabs{display:flex;gap:4px;overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px;margin:14px 0;width:fit-content;max-width:100%}
.ws-tab{border:none;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap;display:flex;align-items:center;gap:6px}
.ws-tab.on{background:var(--ac-light);color:var(--ac-dark);font-weight:700}
.ws-tab-badge{background:var(--bg);border:1px solid var(--bd);border-radius:999px;font-size:11px;padding:0 6px;color:var(--mu)}
.ws-tab.on .ws-tab-badge{background:#fff;border-color:#ffe0c2}

.ev-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ev-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s;display:flex;flex-direction:column;gap:6px;animation:auth-in .25s ease}
.ev-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.ev-card.ev-locked{border-style:dashed;background:var(--bg-alt)}
.ev-card-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ev-type-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ac-dark);background:var(--ac-light);border-radius:6px;padding:2px 7px}
.ev-card h3{margin:2px 0 0;font-size:14.5px}
.ev-content{font-size:13px;color:var(--tx);white-space:pre-wrap;margin:2px 0}
.ev-locked-msg{font-size:12.5px;margin:2px 0}
.ev-relevance{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.ev-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);white-space:nowrap}
.ev-toggle input{width:auto}
.contradiction-card h3{color:var(--bad)}
.contradiction-row{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.contradiction-row:last-child{border-bottom:none}

.hyp-grid{display:grid;gap:12px}
.hyp-card{border:1px solid var(--bd);border-radius:var(--r-md);padding:12px;background:var(--bg-alt)}
.hyp-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hyp-statement{font-size:14px;margin:0 0 8px}
.hyp-links{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.hyp-status-active{background:var(--ac-light);color:var(--ac-dark);border-color:#ffe0c2}
.hyp-status-supported{background:#eaf7ee;color:#1b7f4b;border-color:#cdeeda}
.hyp-status-refuted{background:#fdeceb;color:#c23616;border-color:#f8d2cd}
.hyp-status-abandoned{background:var(--bg);color:var(--mu)}
.conclude-card{border-color:var(--ac)}
.cite-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:2px;margin:6px 0 12px}
.cite-item{font-size:13px}
.notes-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.note-item{background:var(--bg-alt);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 10px;font-size:13.5px;white-space:pre-wrap}

.timeline-list{display:flex;flex-direction:column}
.timeline-row{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--bd);align-items:flex-start}
.timeline-row:last-child{border-bottom:none}
.timeline-icon{width:26px;height:26px;border-radius:50%;background:var(--ac-light);display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.timeline-body{font-size:13.5px}

.chat-card{display:flex;flex-direction:column}
.chat-log{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.chat-msg{display:flex}
.chat-user{justify-content:flex-end}
.chat-ai{justify-content:flex-start}
.chat-bubble{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.5}
.chat-user .chat-bubble{background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.chat-ai .chat-bubble{background:var(--bg-alt);border:1px solid var(--bd);border-bottom-left-radius:4px}
.chat-thinking{display:flex;gap:4px;align-items:center;padding:12px 16px}
.chat-thinking span{width:6px;height:6px;border-radius:50%;background:var(--mu);animation:chat-bounce 1.1s infinite ease-in-out}
.chat-thinking span:nth-child(2){animation-delay:.15s}.chat-thinking span:nth-child(3){animation-delay:.3s}
@keyframes chat-bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.chat-input-row{margin-top:8px}

.graph-toolbar{display:flex;justify-content:space-between;align-items:center}
.graph-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0 12px;font-size:12.5px;color:var(--mu)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend-evidence{background:var(--ac-light);border:2px solid var(--ac)}
.legend-hypothesis{background:#eef1f5;border:2px solid #44506b}
.legend-line{width:20px;height:0;border-top:2px solid;display:inline-block}
.legend-supports{border-color:#1b7f4b}
.legend-contradicts{border-color:#c23616}
.legend-flag{border-top-style:dashed;border-color:#b8860b}
.graph-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg-alt);padding:8px}
.graph-svg{display:block}
.graph-node{cursor:pointer}
.graph-node circle,.graph-node rect{fill:var(--ac-light);stroke:var(--ac);stroke-width:2;transition:filter .15s}
.graph-node.node-hypothesis circle,.graph-node.node-hypothesis rect{fill:#eef1f5;stroke:#44506b}
.graph-node.node-status-supported rect{stroke:#1b7f4b}
.graph-node.node-status-refuted rect{stroke:#c23616}
.graph-node.node-status-abandoned rect{stroke:#9aa3af;stroke-dasharray:4 3}
.graph-node:hover circle,.graph-node:hover rect{filter:brightness(.96)}
.graph-node.selected circle,.graph-node.selected rect{stroke-width:3.5}
.node-label{font-size:10.5px;text-anchor:middle;fill:var(--tx);pointer-events:none;font-weight:600}
.graph-row-label text{font-size:11px;fill:var(--mu);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.graph-edge line{stroke:#9aa3af;stroke-width:1.6}
.graph-edge.edge-supports line{stroke:#1b7f4b}
.graph-edge.edge-contradicts line{stroke:#c23616}
.graph-edge.edge-flag line{stroke:#b8860b;stroke-dasharray:5 4}
.edge-label{font-size:9.5px;fill:var(--mu);text-anchor:middle}
.graph-edge marker path{fill:#9aa3af}
.graph-edge.edge-supports marker path{fill:#1b7f4b}
.graph-edge.edge-contradicts marker path{fill:#c23616}
.graph-detail{margin-top:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--bg-alt);font-size:13px}
.graph-loading{display:flex;align-items:center;gap:10px;padding:40px 0;justify-content:center}
.graph-spin{border-color:rgba(255,106,26,.25);border-top-color:var(--ac)}
@media(max-width:720px){.ws-header-top{flex-wrap:wrap;gap:8px}.cite-grid{grid-template-columns:1fr}}

/* ---- AI Investigator chat (Phase 5) ---- */
.chat-identity{display:flex;align-items:center;gap:8px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--bd);font-size:13px}
.chat-identity-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(27,127,75,.15);flex:none;animation:dot-pulse 2s infinite}
@keyframes dot-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,var(--ac),var(--ac-dark));color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.chat-ai{align-items:flex-end;gap:8px}
.chat-ai-body{display:flex;flex-direction:column;gap:4px;max-width:78%}
.chat-ai .chat-bubble{max-width:100%}
.chat-empty{padding:28px 16px}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chat-suggestion{font-size:12.5px;border-radius:999px;padding:6px 13px;background:var(--ac-light);border-color:#ffe0c2;color:var(--ac-dark)}
.chat-suggestion:hover{background:#ffe3c7}
.chat-evidence-refs{display:flex;flex-wrap:wrap;gap:6px}
.chat-ev-chip{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--bg-alt);color:var(--mu);border-color:var(--bd)}
.chat-ev-chip:hover{border-color:var(--ac);color:var(--ac-dark)}
.chat-bubble.chat-error{background:#fdeceb;border:1px solid #f8d2cd;color:#c23616}
.chat-thinking em{font-style:normal;color:var(--mu);font-size:12px;margin-left:4px}

/* ---- Cognitive Performance Report (Phase 6) ---- */
.report-top{display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.report-actions{display:flex;gap:8px}
.score-ring{width:128px;height:128px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.score-ring-inner{width:100px;height:100px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.score-ring-num{font-size:28px;font-weight:800;color:var(--tx);line-height:1}
.score-ring-label{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.report-meta{display:flex;flex-direction:column;gap:6px}
.report-meta-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.report-status-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.perf-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:18px}
.perf-item{display:flex;flex-direction:column;gap:6px}
.perf-item-top{display:flex;justify-content:space-between;font-size:13px}
.perf-item-top b{font-size:15px}
.perf-bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden}
.perf-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--ac-dark))}
.flag-banner{display:flex;gap:8px;align-items:flex-start;background:#fff6e9;border:1px solid #f3dca8;color:#8a6200;border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-top:10px}
@media(prefers-color-scheme:dark){.flag-banner{background:#3a2c0f;border-color:#5c481c;color:var(--wa)}}
.skill-row{padding:12px 0;border-bottom:1px solid var(--bd)}
.skill-row:last-child{border-bottom:none}
.skill-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.skill-name{font-weight:600;font-size:13.5px}
.skill-score{font-weight:700;font-size:13.5px}
.skill-score.band-strong{color:#1b7f4b}.skill-score.band-mid{color:var(--ac-dark)}.skill-score.band-weak{color:#c23616}.skill-score.band-na{color:var(--mu)}
.skill-bar{height:7px;border-radius:5px;background:var(--bd);overflow:hidden;margin-bottom:6px}
.skill-bar-fill{height:100%;border-radius:5px}
.skill-bar-fill.band-strong{background:#1b7f4b}.skill-bar-fill.band-mid{background:var(--ac)}.skill-bar-fill.band-weak{background:#c23616}.skill-bar-fill.band-na{background:var(--bd)}
.skill-explanation{font-size:12.5px;color:var(--mu);line-height:1.5}
.coverage-note{font-size:11px;color:var(--mu);margin-top:3px}
.behavior-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.behavior-tile{background:var(--bg-alt);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px}
.behavior-tile-val{font-size:18px;font-weight:700;color:var(--ac-dark)}

function trendLabel(t){return t==='improving'?'↑ Improving':t==='needs_focus'?'↓ Needs focus':t==='steady'?'→ Steady':'Not enough data'}
function sparkline(history){
  if(!history||history.length<2)return '';
  const w=90,h=28,min=Math.min(...history),max=Math.max(...history),range=(max-min)||1;
  const pts=history.map((v,i)=>[i/(history.length-1)*w,h-((v-min)/range)*h*0.86-2]);
  const d=pts.map((pp,i)=>(i===0?'M':'L')+pp[0].toFixed(1)+','+pp[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="skill-sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path class="spark-line" d="${d}"></path><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5"></circle></svg>`;
}

function adminStatBlock(a){
  const cases=Object.values(a.per_case);

  const totalAttempts=cases.reduce((s,c)=>s+c.attempts,0);

  const overallSolveRate=totalCompleted?Math.round(solvedWeighted/totalCompleted*100):null;
  const scored=cases.filter(c=>c.avg_final_score!=null&&c.completed);
  const scoredCompleted=scored.reduce((s,c)=>s+c.completed,0);
  const overallAvgScore=scoredCompleted?Math.round(scored.reduce((s,c)=>s+c.avg_final_score*c.completed,0)/scoredCompleted):null;
  return `<div class="stat-row">
    <div class="stat-card"><div class="stat-num">${a.total_users}</div><div class="stat-label">Total users</div></div>
    <div class="stat-card"><div class="stat-num">${a.total_sessions}</div><div class="stat-label">Total investigations</div></div>
    <div class="stat-card"><div class="stat-num">${totalCompleted}/${totalAttempts}</div><div class="stat-label">Completed / started</div></div>
    <div class="stat-card"><div class="stat-num">${overallSolveRate==null?'n/a':overallSolveRate+'%'}</div><div class="stat-label">Overall solve rate</div></div>
    <div class="stat-card"><div class="stat-num">${overallAvgScore??'n/a'}</div><div class="stat-label">Avg final score</div></div>
  </div>`;
}

function renderGraphSvg(g){
  const evNodes=g.nodes.filter(n=>n.kind==='evidence'),hyNodes=g.nodes.filter(n=>n.kind==='hypothesis');
  const colW=170,topY=55,botY=255,pad=90;
  const width=Math.max(620,pad*2+colW*Math.max(evNodes.length,hyNodes.length,1));
  const height=320;
  const pos={};
  evNodes.forEach((n,i)=>{pos[n.id]={x:pad+colW*i+colW/2,y:topY}});
  hyNodes.forEach((n,i)=>{pos[n.id]={x:pad+colW*i+colW/2,y:botY}});
  const edgesSvg=g.edges.map((e,idx)=>{
    const a=pos[e.source],b=pos[e.target];if(!a||!b)return '';
    const cls=e.relation==='supports'?'edge-supports':e.relation==='contradicts'?'edge-contradicts':'edge-flag';
    const midx=(a.x+b.x)/2,midy=(a.y+b.y)/2-6;
    return `<g class="graph-edge ${cls}"><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" marker-end="url(#arrow-${cls})"></line>
    <text x="${midx}" y="${midy}" class="edge-label">${esc(e.relation.replace(/_/g,' '))}</text></g>`;
  }).join('');
  const nodeSvg=g.nodes.map(n=>{
    const p=pos[n.id];if(!p)return '';
    const isHyp=n.kind==='hypothesis';
    const maxLen=isHyp?22:14;
    const label=(n.label||'').length>maxLen?n.label.slice(0,maxLen-1)+'\u2026':(n.label||'');
    const statusCls=isHyp?` node-status-${esc(n.status||'active')}`:'';
    return `<g class="graph-node ${isHyp?'node-hypothesis':'node-evidence'}${statusCls}" data-node="${esc(n.id)}" transform="translate(${p.x},${p.y})">
    ${isHyp?`<rect x="-62" y="-22" width="124" height="44" rx="10"></rect>`:`<circle r="26"></circle>`}
    <text class="node-label" y="4">${esc(label)}</text></g>`;
  }).join('');
  const defs=['edge-supports','edge-contradicts','edge-flag'].map(c=>`<marker id="arrow-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"></path></marker>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" class="graph-svg" style="min-width:${width}px">
  <defs>${defs}</defs>
  <g class="graph-row-label"><text x="${pad}" y="18">Evidence</text><text x="${pad}" y="${botY+42}">Hypotheses</text></g>
  ${edgesSvg}${nodeSvg}</svg>
  <div id="graphDetail" class="graph-detail" hidden></div>`;
}

    <div class="graph-legend">

    </div>
  </div>
  <div class="grid report-grid">

  const [cs,ss,pr]=await Promise.all([api('GET','/cases'),api('GET','/sessions'),api('GET','/profile').catch(()=>null)]);
  cases=cs;mySessions=ss;profileData=pr;casesLoaded=true;draw();}
async function loadPrivacy(){sid=ws=rep=null;page='privacy';privacyNotice=null;privacyLoadError=null;privacyExportState='idle';privacyExportError='';privacyDeleteBusy=false;draw();
  try{privacyNotice=await api('GET','/privacy/notice')}catch(ex){privacyLoadError=ex.message||'Could not load privacy information.'}
  draw();}
async function loadShared(){sharedLoading=true;sharedError='';sharedData=null;draw();
  try{const r=await fetch('/shared/'+encodeURIComponent(sharedToken),{headers:{Accept:'application/json'}});let d=null;try{d=await r.json()}catch(e){}
    if(!r.ok)throw new Error(fmtErr(d)||'This link is unavailable.');sharedData=d}
  catch(ex){sharedError=ex.message||'This link is unavailable.'}
  sharedLoading=false;draw();}
async function loadProfile(){sid=ws=rep=null;page='profile';profileData=null;profileLoadError=null;profileLatestRec=null;profileLatestRecError=null;draw();
  try{profileData=await api('GET','/profile')}catch(ex){profileLoadError=ex.message||'Could not load your profile.';draw();return}
  draw();
  if(profileData.history.length)loadProfileRecommendation();}
async function loadProfileRecommendation(){
  const latest=profileData.history[profileData.history.length-1];
  profileLatestRecLoading=true;draw();
  try{const rep2=await api('GET',`/sessions/${latest.session_id}/report`);profileLatestRec={title:latest.title,items:rep2.recommended_development||[]}}
  catch(ex){profileLatestRecError='Could not load development recommendations right now.'}
  profileLatestRecLoading=false;draw();}
async function loadAdmin(){sid=ws=rep=null;page='admin';adminTab='analytics';analytics=adminCases=null;adminLoadError=null;draw();
  try{[analytics,adminCases]=await Promise.all([api('GET','/admin/analytics'),api('GET','/admin/cases')])}
  catch(ex){adminLoadError=ex.message||'Could not load admin data.'}
  draw();}
async function refreshAdminData(){
  try{[analytics,adminCases]=await Promise.all([api('GET','/admin/analytics'),api('GET','/admin/cases')]);adminLoadError=null}
  catch(ex){adminLoadError=ex.message||'Could not load admin data.'}
  draw();}
async function refreshWs(){ws=await api('GET','/sessions/'+sid);rep=ws.closed?await api('GET',`/sessions/${sid}/report`):null;wsGraph=null;draw();if(wsTab==='graph')loadGraph()}
async function loadWs(id){sid=id;wsTab='evidence';wsGraph=null;wsGraphError=null;wsGraphLoading=false;wsActivity=[];chatThinking=false;chatError=null;evFilter={q:'',onlyUnopened:false};
  await refreshWs();if(ws&&!ws.closed)logActivity('open','Opened investigation')}
async function loadGraph(){if(wsGraphLoading)return;wsGraphLoading=true;wsGraphError=null;draw();
  try{wsGraph=await api('GET',S()+'/graph')}catch(ex){wsGraphError=ex.message||'Failed to load the knowledge graph.'}
  wsGraphLoading=false;draw()}
async function afterAuth(email,password){const d=await api('POST','/auth/login',{email,password});token=d.access_token;user=d.user;
  try{sessionStorage.setItem('t',token)}catch(e){}await loadCases()}
const act=async(fn)=>{try{await fn()}catch(e){toast(e.message)}};
const S=()=>'/sessions/'+sid;

document.addEventListener('submit',e=>{e.preventDefault();const a=e.target.dataset.a,f=F(e),id=e.target.dataset.id;
  if(a==='admin-save'){const btn=e.submitter,mode=btn?btn.dataset.mode:'create';return act(async()=>{
    let parsed;try{parsed=JSON.parse(f.json)}catch(x){throw new Error('Invalid JSON: '+x.message)}
    caseDraft=f.json;
    if(mode==='create')await api('POST','/admin/cases',parsed);else await api('PUT','/admin/cases/'+parsed.case_id,parsed);
    toast(mode==='create'?'Case created.':'Case updated.');
    return refreshAdminData()})}
  if(a==='login'||a==='register'){
    const btn=$('#authSubmit'),err=$('#authErr');
    if(err){err.hidden=true;err.textContent=''}
    if(btn){btn.dataset.label=btn.dataset.label||btn.textContent;btn.disabled=true;
      btn.innerHTML='<span class="auth-spin"></span>'+(a==='login'?'Signing in…':'Creating account…')}
    (async()=>{try{
      if(a==='login')await afterAuth(f.email,f.password);
      else{await api('POST','/auth/register',{email:f.email,password:f.password,consent_version:consent.version});await afterAuth(f.email,f.password)}
    }catch(ex){
      if(err){err.textContent=ex.message||'Something went wrong. Please try again.';err.hidden=false}else toast(ex.message);
      if(btn){btn.disabled=false;btn.textContent=btn.dataset.label}
    }})();
    return;
  }
  if(a==='ask'){
    const text=f.text;if(!text)return;
    chatError=null;chatThinking=true;draw();
    (async()=>{try{
      const r=await api('POST',S()+'/ask',{text});
      const evidence=[...(r.new_evidence||[]),...(r.adaptive_evidence||[])];
      chat.push({sid,q:text,a:r.response,evidence});logActivity('ask','Asked: "'+text+'"');
      chatThinking=false;await refreshWs();
    }catch(ex){chatThinking=false;chatError=ex.message||'Something went wrong answering that. Please try again.';draw()}})();
    return;
  }
  act(async()=>{
  if(a==='hyp'){await api('POST',S()+'/hypotheses',{statement:f.statement,confidence:f.c/100});logActivity('hyp','New hypothesis: "'+f.statement+'"');return refreshWs()}
  if(a==='link'){await api('POST',S()+'/links',{hypothesis_id:id,evidence_id:f.e,relation:f.r});logActivity('link',`Linked ${f.e} (${f.r}) to ${id}`);return refreshWs()}
  if(a==='flag'){await api('POST',S()+'/contradictions',{evidence_a:f.a,evidence_b:f.b});logActivity('flag',`Flagged contradiction: ${f.a} vs ${f.b}`);return refreshWs()}
  if(a==='note'){await api('POST',S()+'/notes',{text:f.text});logActivity('note','Added a note');return refreshWs()}
  if(a==='conclude'){if(!await askConfirmation({title:'Submit final conclusion?',message:'Submitting locks this investigation. You will not be able to change your conclusion afterward.',acceptLabel:'Submit conclusion'}))return;
    const cited=[...e.target.querySelectorAll('input[name=cite]:checked')].map(x=>x.value);
    await api('POST',S()+'/conclusion',{text:f.text,confidence:f.c/100,cited_evidence:cited});logActivity('conclude','Submitted final conclusion');return loadWs(sid)}
})});
document.addEventListener('click',e=>{const t=e.target.closest('button[data-a]');if(!t||(t.form&&!t.matches('[data-a^="confirm-"]')))return;const a=t.dataset.a,id=t.dataset.id;act(async()=>{
  if(a==='confirm-accept'){if(!t.disabled)finishConfirmation(true);return}
  if(a==='confirm-cancel'){finishConfirmation(false);return}
  if(a==='out'){try{await api('POST','/auth/logout')}catch(x){}return signOut()}
  if(a==='mode'){mode=mode==='login'?'register':'login';if(mode==='register'&&!consent)consent=await api('GET','/consent');return draw()}
  if(a==='home')return loadCases();
  if(a==='nav'){sid=ws=rep=null;const p=t.dataset.p;if(p==='profile')return loadProfile();if(p==='admin')return loadAdmin();if(p==='privacy')return loadPrivacy();return loadCases()}
  if(a==='privacy-retry')return loadPrivacy();
  if(a==='admin-load'){const c=await api('GET','/admin/cases/'+id);caseDraft=JSON.stringify(c,null,2);adminTab='author';return draw()}
  if(a==='admin-del'){if(!await askConfirmation({title:'Delete case?',message:`Delete ${id}? This action cannot be undone.`,acceptLabel:'Delete case'}))return;await api('DELETE','/admin/cases/'+id);toast('Case deleted.','success');return refreshAdminData()}
  if(a==='admin-tab'){adminTab=t.dataset.t;return draw()}
  if(a==='admin-clear'){caseDraft='';return draw()}
  if(a==='start'){const d=await api('POST','/sessions',{case_id:id});return loadWs(d.session_id)}
  if(a==='resume')return loadWs(id);
  if(a==='view'){await api('POST',S()+'/evidence/view',{evidence_id:id});logActivity('view','Opened evidence '+id);return refreshWs()}
  if(a==='rel'){const v=t.dataset.v==='1';await api('POST',S()+'/evidence/relevance',{evidence_id:id,relevant:v});logActivity('rel',`Marked ${id} as ${v?'relevant':'not relevant'}`);return refreshWs()}
  if(a==='wstab'){wsTab=t.dataset.t;draw();if(wsTab==='graph'&&!wsGraph)return loadGraph();return}
  if(a==='graph-refresh')return loadGraph();
  if(a==='suggest'){const inp=$('#chatInput');if(inp){inp.value=t.dataset.q;inp.focus()}return}
  if(a==='chat-ev'){wsTab='evidence';evFilter={...evFilter,q:''};draw();return}
  if(a==='print-report'){window.print();return}
  if(a==='share'){const r=await api('POST',S()+'/share');shareUrl=location.origin+'/?shared='+encodeURIComponent(r.share_token);shareSessionId=sid;draw();toast('Read-only link created.','success');return}
  if(a==='share-copy'){const input=$('#shareUrl');try{await navigator.clipboard.writeText(shareUrl);toast('Read-only link copied.','success')}
    catch(ex){input.focus();input.select();toast('Link selected. Copy it to share.','info')}return}
  if(a==='share-revoke'){if(!await askConfirmation({title:'Revoke shared links?',message:'Anyone using an existing link to this investigation will lose access.',acceptLabel:'Revoke links'}))return;
    await api('DELETE',S()+'/share');shareUrl='';shareSessionId=null;draw();toast('All share links for this investigation were revoked.','success');return}
  if(a==='privacy-export'){
    privacyExportState='loading';privacyExportError='';draw();
    try{const data=await api('GET','/privacy/export');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const objectUrl=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=objectUrl;a2.download='cra-data-export.json';document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);
      privacyExportState='success';toast('Your data export is ready.','success')}
    catch(ex){privacyExportState='error';privacyExportError=ex.message||'The export could not be prepared.';toast(privacyExportError,'error')}
    draw();return}
  if(a==='privacy-delete'){
    if(!await askConfirmation({title:'Permanently delete your account?',message:'This erases your account, all investigation history and every share link created by this account. There is no recovery. Type DELETE to continue.',acceptLabel:'Delete account',requireDelete:true}))return;
    privacyDeleteBusy=true;draw();try{await api('DELETE','/privacy/account');toast('Your account and data have been deleted.','success');return signOut()}
    catch(ex){privacyDeleteBusy=false;draw();throw ex}}
})});
document.addEventListener('input',e=>{
  if(e.target.id==='caseSearch'){caseFilter.q=e.target.value;renderGridOnly()}
  if(e.target.id==='evSearch'){evFilter.q=e.target.value;renderEvGridOnly()}
  if(e.target.id==='adminAnalyticsSearch'){adminAnalyticsFilter.q=e.target.value;renderAnalyticsOnly()}
  if(e.target.id==='adminCaseSearch'){adminCaseFilter.q=e.target.value;renderAdminCaseListOnly()}
});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset&&t.dataset.a,id=t.dataset&&t.dataset.id;
  if(t.id==='caseDifficulty'){caseFilter.difficulty=t.value;return renderGridOnly()}
  if(t.id==='caseSort'){caseFilter.sort=t.value;return renderGridOnly()}
  if(t.id==='evOnlyUnopened'){evFilter.onlyUnopened=t.checked;return renderEvGridOnly()}
  if(t.id==='adminAnalyticsSort'){adminAnalyticsFilter.sort=t.value;return renderAnalyticsOnly()}
  if(a==='conf'||a==='status')act(async()=>{await api('PATCH',`${S()}/hypotheses/${id}`,a==='conf'?{confidence:t.value/100}:{status:t.value});logActivity(a,a==='conf'?`Adjusted confidence on ${id}`:`Set ${id} status to ${t.value}`);return refreshWs()})});
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-a="admin-sort"]');
  if(th){adminAnalyticsFilter.sort=th.dataset.k;renderAnalyticsOnly();return}
});
document.addEventListener('click',e=>{
  const g=e.target.closest('.graph-node');if(!g)return;
  const nid=g.dataset.node;const n=(wsGraph&&wsGraph.nodes||[]).find(x=>x.id===nid);
  const panel=$('#graphDetail');if(!panel||!n)return;
  document.querySelectorAll('.graph-node.selected').forEach(x=>x.classList.remove('selected'));
  g.classList.add('selected');panel.hidden=false;
  panel.innerHTML=n.kind==='hypothesis'
    ?`<b>${esc(n.id)}</b> ${esc(n.label)}<div class="mu">Status: ${esc(n.status)} &middot; Confidence ${Math.round((n.confidence||0)*100)}%</div>`
    :`<b>${esc(n.id)}</b> ${esc(n.label)}<div class="mu">Type: ${esc(n.type)} &middot; ${n.opened?'Opened':'Not yet opened'}</div>`;
});
(async()=>{if(sharedToken)return loadShared();if(token){try{user=await api('GET','/me');return await loadCases()}catch(e){token=null}}draw()})();
</script></body></html>
