services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cognitive_research
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
  web:
    build: .
    depends_on: [db]
    environment:
      DB_ENGINE: mysql
      DB_NAME: cognitive_research
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: db
      DB_PORT: 3306
      DJANGO_DEBUG: "true"
    ports: ["8000:8000"]
