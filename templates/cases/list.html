{% extends 'base.html' %}{% block content %}<h1>Case Library</h1><div class="grid">{% for case in cases %}<article class="card"><span class="tag">{{ case.difficulty }}</span><h2>{{ case.title }}</h2><p>{{ case.overview|truncatewords:35 }}</p><p><small>{{ case.domain }}</small></p><a href="/cases/{{ case.id }}/">View case</a></article>{% empty %}<p>No published cases.</p>{% endfor %}</div>{% endblock %}
